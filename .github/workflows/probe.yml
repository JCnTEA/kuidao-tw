name: Probe Social Icons
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: probe
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: cargo +stable test --locked --all-targets --features record,sdk-js,sdk-material --target x86_64-pc-windows-msvc --lib social_unread_stack_keeps_service_icons_visible -- --test-threads=1 --nocapture
