name: Build Windows (Taiwan)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'hist/**'
      - '*.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Download NSIS
        shell: pwsh
        run: |
          $compiler = ./scripts/get-nsis.ps1 -Directory "$env:RUNNER_TEMP\nsis"
          "NSIS_COMPILER=$compiler" >> $env:GITHUB_ENV

      - name: Prepare code signing certificate
        shell: pwsh
        env:
          CODESIGN_PFX_B64: ${{ secrets.CODESIGN_PFX_B64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
          CODESIGN_THUMBPRINT: ${{ secrets.CODESIGN_THUMBPRINT }}
        run: |
          if ($env:CODESIGN_PFX_B64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX_B64))
            $env:CODESIGN_PFX = $pfx
            "CODESIGN_PFX=$pfx" >> $env:GITHUB_ENV
          }
          if ($env:CODESIGN_PFX_PASSWORD) { "CODESIGN_PFX_PASSWORD=$($env:CODESIGN_PFX_PASSWORD)" >> $env:GITHUB_ENV }
          if ($env:CODESIGN_THUMBPRINT) { "CODESIGN_THUMBPRINT=$($env:CODESIGN_THUMBPRINT)" >> $env:GITHUB_ENV }

      - name: Build and package
        shell: pwsh
        run: |
          ./scripts/package.ps1 -NsisCompiler $env:NSIS_COMPILER -OutputDirectory "$env:GITHUB_WORKSPACE\dist"

      - name: Verify bootstrap ZIP extraction
        shell: pwsh
        run: |
          cargo test --locked --release --bin kuidao-bootstrap -- bootstrap_extracts_unicode_zip_without_tar

      - name: Smoke test installer integrity
        shell: pwsh
        run: |
          $setup = (Resolve-Path 'dist\Kuidao-Setup-TW-x64.exe').Path
          $process = Start-Process -FilePath $setup -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "安裝檔回傳 $($process.ExitCode)" }
          $install = Join-Path $env:ProgramFiles 'Kuidao'
          if (-not (Test-Path -LiteralPath (Join-Path $install 'kuidao-bootstrap.exe'))) { throw '安裝後找不到啟動器' }
          $uninstall = Join-Path $install 'Uninstall.exe'
          if (Test-Path -LiteralPath $uninstall) {
            $u = Start-Process -FilePath $uninstall -ArgumentList '/S' -Wait -PassThru
            if ($u.ExitCode -ne 0) { throw "解除安裝回傳 $($u.ExitCode)" }
          }

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: kuidao-tw-release
          path: |
            dist\Kuidao-Setup-TW-x64.exe
            dist\Kuidao-v0.6.108-tw-windows-x64.zip
            dist\SHA256SUMS.txt
