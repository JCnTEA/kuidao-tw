name: Build Windows (Taiwan)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --bin kuidao

      - name: Upload program
        uses: actions/upload-artifact@v4
        with:
          name: kuidao-tw-windows-x64
          path: target\release\kuidao.exe
