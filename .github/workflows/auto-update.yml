name: 上游自動同步與發布

on:
  schedule:
    - cron: '0 17 * * *'   # 每日台灣時間 01:00（UTC+8）檢查上游並發布
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.chk.outputs.changed }}
      version: ${{ steps.chk.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝 OpenCC
        run: pip install opencc-python-reimplemented

      - name: 拉上游並台灣化
        id: chk
        run: |
          set +e
          python tools/sync_upstream.py
          rc=$?
          set -e
          ver=$(cat .upstream-version 2>/dev/null || echo none)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if [ "$rc" = "0" ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi

      - name: 提交變更
        if: steps.chk.outputs.changed == 'true'
        run: |
          git config user.name "鬼島 自動同步"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "sync: 上游 v${{ steps.chk.outputs.version }}"
          git push

  build:
    needs: sync
    if: needs.sync.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 安裝 NSIS
        run: choco install nsis -y --no-progress

      - name: Prepare code signing certificate
        shell: pwsh
        env:
          CODESIGN_PFX_B64: ${{ secrets.CODESIGN_PFX_B64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: |
          if ($env:CODESIGN_PFX_B64) {
            $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODESIGN_PFX_B64))
            $env:CODESIGN_PFX = $pfx
            "CODESIGN_PFX=$pfx" >> $env:GITHUB_ENV
          }
          if ($env:CODESIGN_PFX_PASSWORD) { "CODESIGN_PFX_PASSWORD=$($env:CODESIGN_PFX_PASSWORD)" >> $env:GITHUB_ENV }

      - name: 編譯
        run: cargo build --release --bin kuidao --bin kuidao-bootstrap

      - name: 打包
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $name = "Kuidao-v$ver-tw-windows-x64.zip"
          # 打包前先簽主程式與啟動器（啟動器會被嵌進安裝檔，主程式會進入 ZIP）。
          ./scripts/sign.ps1 -FilePath @("target\release\kuidao.exe", "target\release\kuidao-bootstrap.exe")
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "target\release\kuidao.exe" dist
          if (Test-Path assets) { Copy-Item assets dist -Recurse -Force }
          if (Test-Path README.md) { Copy-Item README.md dist }
          if (Test-Path NOTICE)       { Copy-Item NOTICE dist }
          if (Test-Path LICENSE)      { Copy-Item LICENSE dist }
          Compress-Archive -Path "dist\*" -DestinationPath $name -Force
          $setup = "Kuidao-Setup-TW-x64.exe"
          $nsis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          & $nsis /V2 /WX "/DAPP_VERSION=$ver" "/DPROJECT_DIR=$PWD" "/DBOOTSTRAP_EXE=$(Join-Path $PWD 'target\release\kuidao-bootstrap.exe')" "/DOUTPUT_FILE=$(Join-Path $PWD $setup)" installer\setup.nsi
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          # 安裝檔本身再補一層簽章。
          ./scripts/sign.ps1 -FilePath @($setup)
          echo "ASSET=$name" >> $env:GITHUB_ENV
          echo "SETUP=$setup" >> $env:GITHUB_ENV
          echo "VER=$ver"    >> $env:GITHUB_ENV

      - name: 發布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}-tw
          name: 鬼島 Kuidao 桌面靈動島 v${{ env.VER }}（台灣版）
          body: |
            由上游開源專案（MIT）v${{ env.VER }} 自動同步，經繁體中文與台灣用語調整後編譯。
            - 安裝版：`Kuidao-Setup-TW-x64.exe`，檔名固定不帶版本；官網下載連結保持不變，第一次開啟才下載主程式並顯示下載進度
            - 發佈包：`Kuidao-v${{ env.VER }}-tw-windows-x64.zip` 供程式內更新使用，一般使用者只需下載安裝檔
            - 關於頁：新增「更新內容資料庫」，每次取得最新 Release 整份覆寫，只保留最新一筆，不累積上一筆
            - 吉祥物：經典、奶油、毛玻璃、懸浮雲與七款懸浮漸層，共用同一組類似原作者的台灣石虎影格
            - 信箱圖示：與社群通知一致的平面品牌圓，設定頁、島上通知與官網同步
            - 遊戲設定：重新掃描與清除掃描改成同尺寸膠囊按鈕；清除只清空本次結果，不會刪除遊戲或已移除的捷徑設定
            - 無程式碼簽章，首次執行如遇 SmartScreen 請選「仍要執行」
          files: |
            ${{ env.ASSET }}
            ${{ env.SETUP }}
          fail_on_unmatched_files: true

      - name: 更新官網固定下載檔
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path docs\download | Out-Null
          Copy-Item $env:SETUP "docs\download\Kuidao-Setup-TW-x64.exe" -Force
          git config user.name "鬼島 發布"
          git config user.email "bot@users.noreply.github.com"
          git add "docs/download/Kuidao-Setup-TW-x64.exe"
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "release: 更新官網固定安裝檔"
          git pull --rebase --autostash origin main
          git push
