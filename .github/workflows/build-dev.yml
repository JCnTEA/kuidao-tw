name: Build Windows Dev (Taiwan)

on:
  workflow_dispatch:
  push:
    branches: [main, feat/dev-icon]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build dev binary
        shell: pwsh
        env:
          KUIDAO_RC: app.dev.rc
          KUIDAO_CHANNEL: dev
        run: |
          cargo build --locked --release --bin kuidao
          if ($LASTEXITCODE -ne 0) { throw 'Dev build failed' }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item 'target\release\kuidao.exe' 'dist\鬼島 Kuidao 開發版.exe' -Force
          if (Test-Path assets) { Copy-Item assets 'dist\assets' -Recurse -Force }
          if (Test-Path README.md) { Copy-Item README.md dist }
          if (Test-Path NOTICE) { Copy-Item NOTICE dist }
          if (Test-Path LICENSE) { Copy-Item LICENSE dist }

      - name: Verify dev icon resource
        shell: pwsh
        run: |
          $exe = 'dist\鬼島 Kuidao 開發版.exe'
          $info = (Get-Item $exe).VersionInfo
          if ($info.FileDescription -notlike '*開發版*') { throw "版本資源不是開發版：$($info.FileDescription)" }
          Write-Host $info.FileDescription

      - name: Package dev zip
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          Compress-Archive -Path 'dist\*' -DestinationPath "Kuidao-Dev-v$ver-tw-windows-x64.zip" -Force

      - name: Install NSIS
        run: choco install nsis --no-progress -y

      - name: Build dev launcher
        shell: pwsh
        env:
          KUIDAO_BOOTSTRAP_CHANNEL: dev
        run: |
          cargo build --locked --release --bin kuidao-bootstrap
          if ($LASTEXITCODE -ne 0) { throw 'Dev launcher build failed' }

      - name: Build dev installer
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          & $makensis /V2 /WX "/DPROJECT_DIR=$env:GITHUB_WORKSPACE" "/DBOOTSTRAP_EXE=$env:GITHUB_WORKSPACE\target\release\kuidao-bootstrap.exe" "/DOUTPUT_FILE=KuidaoDev-Setup-TW-x64.exe" "/DDISPLAY_VERSION=$ver" "/DDISPLAY_VERSION_NUM=$ver.0" 'installer\setup-dev.nsi'
          if ($LASTEXITCODE -ne 0) { throw 'Dev installer build failed' }
          if (-not (Test-Path 'installer\KuidaoDev-Setup-TW-x64.exe')) { throw 'Dev installer missing' }
          Copy-Item 'installer\KuidaoDev-Setup-TW-x64.exe' 'KuidaoDev-Setup-TW-x64.exe' -Force

      - name: Upload dev artifact
        uses: actions/upload-artifact@v4
        with:
          name: kuidao-tw-dev
          path: |
            dist\鬼島 Kuidao 開發版.exe
            Kuidao-Dev-v*-tw-windows-x64.zip
            KuidaoDev-Setup-TW-x64.exe

      - name: Publish dev launcher to fixed URL
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'dev-latest'
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --prerelease --title '鬼島 Kuidao 開發版（固定下載位址）' --notes '這個標籤只放開發版安裝檔，下載網址固定不變；內容由每次開發版建置自動更新。'
          }
          gh release upload $tag KuidaoDev-Setup-TW-x64.exe --clobber

      - name: Publish versioned dev release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          $tag = "v$ver-tw-dev"
          $zip = "Kuidao-Dev-v$ver-tw-windows-x64.zip"
          if (-not (Test-Path $zip)) { throw "Dev zip missing: $zip" }
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --prerelease --title "鬼島 Kuidao 開發版 $ver" --notes "版本 $ver。啟動器每次啟動會比對這個版本，較新就整包換上（程式＋素材），換完自動重新開啟。"
          }
          gh release upload $tag $zip --clobber
